<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manu QR generator</title><body style="font:16px system-ui;background:#fff0f5;color:#811b4d;text-align:center;padding:30px"><h1>💗 Manu's QR code</h1><p>Paste the published website URL below.</p><input id="u" style="width:90%;padding:12px" placeholder="https://username.github.io/repository/"><p><button onclick="make()">Create QR</button></p><div id="qr"></div><p id="msg"></p><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>function make(){let u=document.getElementById('u').value.trim();if(!/^https?:\\/\\//.test(u)){msg.textContent='Enter the full URL starting with https://';return}qr.innerHTML='';new QRCode(qr,{text:u,width:260,height:260});msg.innerHTML='QR ready. Right-click it and choose Save image as.'}</script></body></html>
